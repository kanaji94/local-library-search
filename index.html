<div id=header>
  <div>
    <h1>📚 地元図書館サーチ</h1>
    <p>地図で図書館を探して、蔵書の貸出状況も確認</p>
  </div>
</div>

<div id=app>
  
  <aside id=sidebar>
    
    <div id=search-panel>
      <div class=tab-group>
        <button class="active tab-btn" id=tab-area-btn onclick="switchTab('area')">🗾 地域</button>
        <button class=tab-btn id=tab-geo-btn onclick="switchTab('geo')">📍 現在地</button>
      </div>

      <div id=tab-area class="active tab-panel">
        <div class=form-row>
          <div class=form-group>
            <label>都道府県</label>
            <select id=pref-select>
              <option value>選択してください</option>
              <option>北海道<option>青森県<option>岩手県</option>
              <option>宮城県<option>秋田県<option>山形県</option>
              <option>福島県<option>茨城県<option>栃木県</option>
              <option>群馬県<option>埼玉県<option>千葉県</option>
              <option>東京都<option>神奈川県<option>新潟県</option>
              <option>富山県<option>石川県<option>福井県</option>
              <option>山梨県<option>長野県<option>岐阜県</option>
              <option>静岡県<option>愛知県<option>三重県</option>
              <option>滋賀県<option>京都府<option>大阪府</option>
              <option>兵庫県<option>奈良県<option>和歌山県</option>
              <option>鳥取県<option>島根県<option>岡山県</option>
              <option>広島県<option>山口県<option>徳島県</option>
              <option>香川県<option>愛媛県<option>高知県</option>
              <option>福岡県<option>佐賀県<option>長崎県</option>
              <option>熊本県<option>大分県<option>宮崎県</option>
              <option>鹿児島県<option>沖縄県</option>
            </select>
          </div>
          <div class=form-group>
            <label>市区町村（任意）</label>
            <input id=city-input placeholder=例：渋谷区>
          </div>
        </div>
        <button class="btn btn-primary" onclick=searchByArea()>🔍 図書館を検索</button>
      </div>

      <div id=tab-geo class=tab-panel>
        <p style=color:var(--muted);margin-bottom:10px;font-size:.8rem>位置情報を使って近くの図書館を探します。</p>
        <button class="btn btn-geo" onclick=searchByGeo()>📍 現在地から探す</button>
      </div>
    </div>

    
    <div id=results-header></div>

    
    <div id=lib-list>
      <div class=empty-state>
        <div class=icon>🗺️</div>
        <p>都道府県を選んで<br>「図書館を検索」を押してください</p>
      </div>
    </div>
  </aside>

  
  <div id=map></div>
</div>


<button id=mobile-toggle onclick=toggleSidebar()>📋 リスト</button>

<script type=module src=library-search.ba972815.js></script>
