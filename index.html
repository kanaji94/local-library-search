<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地元図書館サーチ</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --sidebar-w: 360px;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      display: flex;
      flex-direction: column;
      color: var(--text);
    }

    /* ===== HEADER ===== */
    #header {
      background: linear-gradient(135deg, #1e40af 0%, #2563eb 50%, #0ea5e9 100%);
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    #header h1 { font-size: 1.1rem; font-weight: 800; }
    #header p  { font-size: 0.75rem; opacity: 0.8; margin-top: 2px; }

    /* ===== LAYOUT ===== */
    #app {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-right: 1px solid var(--border);
      overflow: hidden;
      z-index: 500;
    }

    #search-panel {
      background: white;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab-group {
      display: flex;
      background: var(--bg);
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 14px;
    }
    .tab-btn {
      flex: 1;
      padding: 7px 8px;
      border: none;
      background: transparent;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.15s;
    }
    .tab-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .form-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .form-group { flex: 1; }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      font-size: 0.88rem;
      color: var(--text);
      background: white;
      outline: none;
      transition: border-color 0.15s;
    }
    select:focus, input[type="text"]:focus { border-color: var(--primary); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 16px;
      border: none;
      border-radius: 7px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      width: 100%;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-geo { background: #0ea5e9; color: white; }
    .btn-geo:hover { background: #0284c7; }

    /* ===== RESULTS LIST ===== */
    #results-header {
      padding: 10px 16px 6px;
      font-size: 0.78rem;
      color: var(--muted);
      background: var(--bg);
      flex-shrink: 0;
    }
    #results-header strong { color: var(--primary); }

    #lib-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .lib-item {
      background: white;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 6px;
      border-left: 3px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
    }
    .lib-item:hover {
      border-left-color: var(--primary);
      box-shadow: 0 2px 8px rgba(37,99,235,0.12);
      transform: translateX(2px);
    }
    .lib-item.active {
      border-left-color: var(--primary);
      background: #eff6ff;
    }
    .lib-item .lib-name {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .lib-item .lib-addr {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .lib-item .no-geo-badge {
      display: inline-block;
      font-size: 0.65rem;
      background: #f1f5f9;
      color: var(--muted);
      border-radius: 4px;
      padding: 1px 5px;
      margin-top: 3px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }
    .empty-state p { font-size: 0.85rem; line-height: 1.6; }

    /* ===== MAP ===== */
    #map {
      flex: 1;
      z-index: 1;
    }

    /* ===== LEAFLET CUSTOM ===== */
    .lib-pin {
      width: 40px;
      height: 40px;
      background: white;
      border: 2.5px solid var(--primary);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: border-color 0.2s, transform 0.2s;
    }
    .lib-pin span {
      transform: rotate(45deg);
      font-size: 16px;
      display: block;
      line-height: 1;
    }
    .lib-pin.active {
      background: var(--primary);
      border-color: #1d4ed8;
    }
    .lib-pin.active span { filter: brightness(0) invert(1); }

    /* Leaflet popup */
    .leaflet-popup-content-wrapper {
      border-radius: 12px !important;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15) !important;
      padding: 0 !important;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      min-width: 280px;
    }
    .popup-inner {
      padding: 16px;
    }
    .popup-name {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .popup-row {
      font-size: 0.82rem;
      color: var(--muted);
      margin: 4px 0;
    }
    .popup-links {
      display: flex;
      gap: 8px;
      margin: 10px 0;
      flex-wrap: wrap;
    }
    .popup-links a {
      font-size: 0.78rem;
      color: var(--primary);
      text-decoration: none;
      background: #eff6ff;
      padding: 3px 9px;
      border-radius: 20px;
      font-weight: 600;
    }
    .popup-links a:hover { background: #dbeafe; }

    .popup-book-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .popup-book-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .popup-isbn-row {
      display: flex;
      gap: 6px;
    }
    .popup-isbn-row input {
      flex: 1;
      padding: 7px 9px;
      font-size: 0.82rem;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      outline: none;
    }
    .popup-isbn-row input:focus { border-color: var(--primary); }
    .popup-isbn-row button {
      padding: 7px 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .popup-isbn-row button:hover { background: var(--primary-dark); }

    #popup-result { margin-top: 8px; }

    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .s-ok   { background: #dcfce7; color: #16a34a; }
    .s-loan { background: #fef3c7; color: #d97706; }
    .s-none { background: #fee2e2; color: #dc2626; }
    .s-check{ background: #dbeafe; color: #2563eb; }
    .s-unk  { background: #f1f5f9; color: #64748b; }

    .book-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
      gap: 6px;
    }
    .book-row:last-child { border-bottom: none; }
    .book-row-name { font-weight: 600; flex: 1; }

    .reserve-link {
      display: block;
      margin-top: 6px;
      font-size: 0.78rem;
      color: var(--primary);
      text-decoration: none;
    }
    .reserve-link:hover { text-decoration: underline; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== MOBILE ===== */
    #mobile-toggle {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 900;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 12px 18px;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(37,99,235,0.4);
      cursor: pointer;
    }

    @media (max-width: 700px) {
      #app { flex-direction: column-reverse; }
      #sidebar {
        width: 100%;
        max-height: 45vh;
        border-right: none;
        border-top: 2px solid var(--border);
        display: none;
      }
      #sidebar.open { display: flex; }
      #map { flex: 1; min-height: 55vh; }
      #mobile-toggle { display: block; }
    }
  </style>
</head>
<body>

<div id="header">
  <div>
    <h1>📚 地元図書館サーチ</h1>
    <p>地図で図書館を探して、蔵書の貸出状況も確認</p>
  </div>
</div>

<div id="app">
  <!-- サイドバー -->
  <aside id="sidebar">
    <!-- 検索フォーム -->
    <div id="search-panel">
      <div class="tab-group">
        <button class="tab-btn active" id="tab-area-btn" onclick="switchTab('area')">🗾 地域</button>
        <button class="tab-btn" id="tab-geo-btn" onclick="switchTab('geo')">📍 現在地</button>
      </div>

      <div id="tab-area" class="tab-panel active">
        <div class="form-row">
          <div class="form-group">
            <label>都道府県</label>
            <select id="pref-select">
              <option value="">選択してください</option>
              <option>北海道</option><option>青森県</option><option>岩手県</option>
              <option>宮城県</option><option>秋田県</option><option>山形県</option>
              <option>福島県</option><option>茨城県</option><option>栃木県</option>
              <option>群馬県</option><option>埼玉県</option><option>千葉県</option>
              <option>東京都</option><option>神奈川県</option><option>新潟県</option>
              <option>富山県</option><option>石川県</option><option>福井県</option>
              <option>山梨県</option><option>長野県</option><option>岐阜県</option>
              <option>静岡県</option><option>愛知県</option><option>三重県</option>
              <option>滋賀県</option><option>京都府</option><option>大阪府</option>
              <option>兵庫県</option><option>奈良県</option><option>和歌山県</option>
              <option>鳥取県</option><option>島根県</option><option>岡山県</option>
              <option>広島県</option><option>山口県</option><option>徳島県</option>
              <option>香川県</option><option>愛媛県</option><option>高知県</option>
              <option>福岡県</option><option>佐賀県</option><option>長崎県</option>
              <option>熊本県</option><option>大分県</option><option>宮崎県</option>
              <option>鹿児島県</option><option>沖縄県</option>
            </select>
          </div>
          <div class="form-group">
            <label>市区町村（任意）</label>
            <input type="text" id="city-input" placeholder="例：渋谷区">
          </div>
        </div>
        <button class="btn btn-primary" onclick="searchByArea()">🔍 図書館を検索</button>
      </div>

      <div id="tab-geo" class="tab-panel">
        <p style="font-size:0.8rem; color:var(--muted); margin-bottom:10px;">位置情報を使って近くの図書館を探します。</p>
        <button class="btn btn-geo" onclick="searchByGeo()">📍 現在地から探す</button>
      </div>
    </div>

    <!-- 件数 -->
    <div id="results-header"></div>

    <!-- 一覧 -->
    <div id="lib-list">
      <div class="empty-state">
        <div class="icon">🗺️</div>
        <p>都道府県を選んで<br>「図書館を検索」を押してください</p>
      </div>
    </div>
  </aside>

  <!-- 地図 -->
  <div id="map"></div>
</div>

<!-- モバイル：リスト表示トグル -->
<button id="mobile-toggle" onclick="toggleSidebar()">📋 リスト</button>

<script type="module" src="./main.js"></script>
</body>
</html>
